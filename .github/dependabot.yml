version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "@typescript-eslint/*"
          - "@vitest/*"
          - "@rollup/*"
          - "@stylistic/*"
          - "@commitlint/*"
          - "eslint*"
          - "eslint-import-resolver-typescript"
          - "globals"
          - "husky"
          - "prettier"
          - "rimraf"
          - "rollup*"
          - "ts-*"
          - "typescript*"
          - "vitest*"
          - "mongodb-memory-server"
          - "conventional-changelog-*"
        dependency-type: "development"
        update-types: ["patch", "minor"]
      dependencies:
        patterns:
          - "pluralize"
          - "mongoose"
        dependency-type: "production"
        update-types: ["patch"]
    ignore:
      - dependency-name: "mongoose"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels: ["github-actions", "dependencies"]
    commit-message:
      prefix: "ci"
      include: "scope"
